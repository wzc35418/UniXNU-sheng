name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17", "macos-27.3-26C5035r"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

      build_userdata:
        description: "Also build userdata-root.img (needs about 16 GB of disk)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 75f35420137371d10b5c66399a39619991cde077 # upstream main at 2026-11-11T15:42:47Z
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: 8a99541c
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: 8a99541c
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v2-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: pinned proprietary firmware
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          ls -l .cache/firmware/nanosic .cache/firmware/novatek
      - name: patch ath12k fetch-sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('device/drivers/Ath12kWifi/tools/fetch-sources.py')
          if not p.is_file():
              print('no fetch-sources.py, skip')
              raise SystemExit(0)
          text = p.read_text()
          old = 'subprocess.run(["git", "-C", str(directory), "sparse-checkout", "add", *source["paths"]], check=True)'
          new = 'subprocess.run(["git", "-C", str(directory), "sparse-checkout", "set", "--no-cone", *paths], check=True)'
          if old in text:
              p.write_text(text.replace(old, new))
              print('patched fetch-sources.py: sparse-checkout set --no-cone with normalized paths')
          elif new in text:
              print('fetch-sources.py already patched')
          else:
              print('fetch-sources.py layout changed; inspect manually')
          PY
      - name: ipsw cache identity
        id: ipsw-key
        env:
          OS_PROFILE: ${{ inputs.os }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=ipsw-v2-' + hashlib.sha256((os.environ.get('OS_PROFILE') or '27').encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: ipsw-cache
        with:
          path: ipsw-cache
          key: ${{ steps.ipsw-key.outputs.key }}
      - name: materialize cached IPSW members
      timeout-minutes: 6
        run: |
          if [ -d ipsw-cache ]; then
            mkdir -p UniXNU/out/ipsw
            rsync -a ipsw-cache/ UniXNU/out/ipsw/ || cp -R ipsw-cache/. UniXNU/out/ipsw/
            du -sh UniXNU/out/ipsw
          else
            echo 'no cached IPSW members; the run downloads them'
          fi
      - name: macos seed cache identity
        id: macos-seed-key
        env:
          OS_PROFILE: ${{ inputs.os }}
        run: |
          echo "key=seed-v2-${OS_PROFILE}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: macos-seed-cache
        with:
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
          key: ${{ steps.macos-seed-key.outputs.key }}
      - name: point the UFS root window at the macOS partition
        working-directory: device
        run: |
          set -e
          f=drivers/ShengUfs/RootLayout.h
          test -f "$f" || { echo "missing $f"; exit 1; }
          if grep -q 'wanted\[\] = "linux"' "$f"; then
            echo 'already retargeted'
          else
            perl -pi -e 's/wanted\[\] = "userdata";/wanted[] = "linux";/' "$f"
          fi
          grep -n 'static const char wanted' "$f"
          grep -q 'wanted\[\] = "linux";' "$f" || { echo 'the retarget did not take'; exit 1; }
      - name: widen the adreno bridge build timeout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('UniXNU/scripts/build-adreno-metal-bridge.py')
          if not p.is_file():
              raise SystemExit('build-adreno-metal-bridge.py not found')
          text = p.read_text()
          new = re.sub(r'timeout=1800\b', 'timeout=5400', text)
          if new != text:
              p.write_text(new)
              print('timeout raised to 5400s')
          else:
              print('timeout already 5400s or changed layout')
          PY
      - name: cargo cache identity
        id: cargo-key
        env:
          OS_PROFILE: ${{ inputs.os }}
        run: |
          echo "key=cargo-v1-${OS_PROFILE}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/target
          key: ${{ steps.cargo-key.outputs.key }}
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: 8a99541c
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          run_build() {
            set +e
            scripts/package.sh "${args[@]}" 2>&1 | tee /tmp/unixnu-build.log
            local status=${PIPESTATUS[0]}
            set -e
            return $status
          }
          for attempt in 1 2 3; do
            if run_build; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo 'three attempts used; giving up'
              break
            fi
            seed_command=$(grep -o 'sudo python3 .*make-macos-data-seed\.py .*' /tmp/unixnu-build.log | head -n 1)
            if [ -n "$seed_command" ]; then
              echo 'the driver asked for a first-install Data seed; running:'
              echo "  $seed_command"
              eval "$seed_command"
              continue
            fi
            if grep -q 'policies/.*/trusted-key\.bin' /tmp/unixnu-build.log; then
              echo 'generating the signed root policies the repository does not ship:'
              policy_env=$(python3 .github/scripts/gen_root_policies.py /tmp/unixnu-build.log | tail -n 1)
              export UNIXNU_SOURCE_STORAGE_POLICIES="${policy_env}"
              echo "selected policies: ${UNIXNU_SOURCE_STORAGE_POLICIES}"
              continue
            fi
            break
          done
          exit 1

      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
      - name: userdata layout
        if: inputs.build_userdata && success()
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./UniXNU/unixnu build userdata --dry-run
          df -h "$GITHUB_WORKSPACE"
      - name: userdata image
        if: inputs.build_userdata && success()
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./UniXNU/unixnu build userdata
          df -h "$GITHUB_WORKSPACE"
      - name: split the userdata image below the artifact limit
        if: inputs.build_userdata && success()
        run: |
          set -e
          df -h "$GITHUB_WORKSPACE" || true
          rm -rf UniXNU/out/ipsw
          rm -rf "$RUNNER_TEMP/ipsw-cache" || true
          echo 'after freeing the IPSW cache:'
          df -h "$GITHUB_WORKSPACE" || true
          python3 .github/scripts/split_userdata.py --chunk-mib 2048 --delete-source \
            UniXNU/out/sheng/*/*/userdata/userdata-root.img
          ls -lh UniXNU/out/sheng/*/*/userdata/ | head -24
      - name: userdata artifact part 000
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-000
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.000
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 001
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-001
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.001
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 002
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-002
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.002
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 003
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-003
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.003
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 004
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-004
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.004
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 005
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-005
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.005
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 006
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-006
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.006
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 007
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-007
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.007
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 008
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-008
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.008
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 009
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-009
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.009
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 010
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-010
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.010
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: userdata artifact part 011
        if: inputs.build_userdata && success()
        uses: actions/upload-artifact@v4
        with:
          name: userdata-${{ inputs.os }}-011
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.011
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.parts.json
      - name: build logs
        if: always()
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil
          root = pathlib.Path('UniXNU/out/sheng')
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'build-logs'
          shutil.rmtree(dest, ignore_errors=True)
          dest.mkdir(parents=True, exist_ok=True)
          seed = os.environ.get('SEED') or ''
          count = 0
          for path in sorted(root.glob('*/*/logs/*.log')) if root.is_dir() else []:
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              text = data.decode('utf-8', 'replace')
              if seed:
                  text = text.replace(seed, '***')
              text = re.sub(r'https?://[^\s"\']*[?&](?:token|sig|signature|key|X-Amz-Signature)=[^\s"\']*', '***', text, flags=re.I)
              (dest / path.name).write_text(text, encoding='utf-8')
              count += 1
          print(f'{count} text logs staged from {root}')
          PY
      - name: build logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/build-logs/*.log
      - name: stage IPSW members for the cache
      timeout-minutes: 6
        if: always()
        run: |
          rm -rf ipsw-cache
          if [ -d UniXNU/out/ipsw ]; then
            mkdir -p ipsw-cache
            # 只留非 *.aea 成员：ipsw.py 支持解密后删掉 aea，凭明文镜像与记录即可跳过下载。
            rsync -a --exclude '*.aea' --remove-source-files UniXNU/out/ipsw/ ipsw-cache/ \
              || tar -C UniXNU/out/ipsw --exclude='*.aea' -cf - . | tar -C ipsw-cache -xf -
            du -sh ipsw-cache || true
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.ipsw-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ipsw-cache
          key: ${{ steps.ipsw-key.outputs.key }}
      - name: disk usage
      timeout-minutes: 3
        if: always()
        run: du -sh UniXNU/out/ipsw UniXNU/out/sheng device/.cache 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always() && steps.macos-seed-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/*/*/runtime/data.dbr') != ''
        continue-on-error: true
        with:
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
          key: ${{ steps.macos-seed-key.outputs.key }}
      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/target
          key: ${{ steps.cargo-key.outputs.key }}
